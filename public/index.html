<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Station</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .container { max-width: 450px; margin: auto; border: 1px solid #ccc; padding: 30px; border-radius: 10px; background: white; box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        select, button { padding: 12px; margin-top: 20px; width: 100%; box-sizing: border-box; border-radius: 6px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; transition: 0.3s; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Station Event Simulator</h1>
        <h2>Select Station ID</h2>
        <select id="station-select"><option value="">-- Select a Station --</option></select>
        <button id="go-button" disabled>Go to Control Panel</button>
    </div>
    <script>
        const stationSelect = document.getElementById("station-select");
        const goButton = document.getElementById("go-button");
        fetch("/stations").then(res => res.json()).then(stations => {
            stations.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s["Station ID"];
                opt.textContent = `${s["Station ID"]} - ${s["Description"] || ''}`;
                stationSelect.appendChild(opt);
            });
        });
        stationSelect.onchange = () => goButton.disabled = !stationSelect.value;
        goButton.onclick = () => window.location.href = `/simulator.html?stationId=${stationSelect.value}`;
    </script>
</body>
</html>
